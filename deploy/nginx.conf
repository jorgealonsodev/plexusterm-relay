# Reverse proxy for plexusterm-relay (PRD-share §5.5, §6.2).
# Two origins: the viewer page must not share an origin with the relay.
# TLS certificates are whatever this server already uses.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Relay: WebSocket endpoints /v1/sharer and /v1/viewer.
server {
    listen 443 ssl;
    http2 on;
    server_name relay.example.com;
    # ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;

    # Client IPs are personal data; the relay itself never logs them.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Pings come every 20 s; keep idle sockets open well past that.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        client_max_body_size 128k;
    }
}

# Viewer: static page at /s/<share-id>. The key is in the #fragment, which
# browsers never send, but share ids must not reach logs either.
server {
    listen 443 ssl;
    http2 on;
    server_name view.example.com;
    # ssl_certificate     /etc/letsencrypt/live/view.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/view.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /s/ {
        access_log off;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}
