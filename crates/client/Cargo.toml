[package]
name = "plexusterm-share-client"
description = "Sans-IO sharer and viewer engines for PlexusTerm terminal sharing, plus a demo sharer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flate2.workspace = true
futures-util.workspace = true
plexusterm-share-protocol.workspace = true
portable-pty.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }
# wss:// for the demo sharer: rustls with the system's root certificates,
# and ring as the one crypto provider (tungstenite enables none itself).
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
plexusterm-relay.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
